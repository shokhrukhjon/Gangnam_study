<head>

<title>Gangnam Study — Koreyscha o'yinlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#0F1E4F;--blue:#2563EB;--red:#E11D48;--green:#16A34A;--amber:#F59E0B;--violet:#7C3AED;--bg:#F4F6FB;--card:#fff;--ink:#1B2233;--mut:#64748B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','Noto Sans KR',system-ui,sans-serif}
.kr{font-family:'Noto Sans KR',sans-serif}
button{font-family:inherit;cursor:pointer;border:0}
#app{max-width:880px;margin:0 auto;padding:18px 16px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;font-family:'Noto Sans KR'}
.brand b{display:block;font-size:18px;color:var(--navy)}.brand small{color:var(--mut);font-weight:700}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:0 2px 0 #E2E8F0;display:flex;gap:8px;align-items:center}
.hero{background:linear-gradient(135deg,#0F1E4F,#2B4FD8 60%,#E11D48);color:#fff;border-radius:24px;padding:26px 24px;position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:30px;line-height:1.15}.hero p{margin:0;opacity:.9;font-weight:600}
.hero .bg{position:absolute;right:-10px;top:-20px;font-size:150px;font-weight:900;opacity:.08;font-family:'Noto Sans KR'}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.inp{flex:1;min-width:180px;border:0;border-radius:14px;padding:12px 14px;font-size:16px;font-family:inherit;font-weight:700}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:14px;padding:4px}
.seg button{background:none;color:#fff;padding:9px 14px;border-radius:10px;font-weight:800}
.seg button.on{background:#fff;color:var(--navy)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px}
.mode{background:var(--card);border-radius:20px;padding:18px;text-align:left;box-shadow:0 4px 0 #E2E8F0;transition:transform .12s}
.mode:hover{transform:translateY(-3px)}.mode:active{transform:translateY(1px)}
.mode .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:10px}
.mode b{display:block;font-size:17px;color:var(--navy)}.mode span{color:var(--mut);font-weight:600;font-size:14px}
.mode .best{margin-top:10px;font-size:13px;font-weight:800;color:var(--amber)}
.panel{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 4px 0 #E2E8F0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.back{background:#EEF2FA;color:var(--navy);padding:9px 14px;border-radius:12px;font-weight:800}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#F4F6FB;border-radius:12px;padding:7px 12px;font-weight:900;color:var(--navy)}
.bar{height:10px;background:#EEF2FA;border-radius:99px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red));transition:width .2s linear}
.word{text-align:center;padding:24px 10px 18px}
.word .k{font-size:56px;font-weight:900;color:var(--navy);font-family:'Noto Sans KR'}
.word .h{color:var(--mut);font-weight:700;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#F4F6FB;border-radius:16px;padding:18px 12px;font-size:18px;font-weight:800;color:var(--ink);box-shadow:0 3px 0 #DDE3EE;transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt.ok{background:#DCFCE7;box-shadow:0 3px 0 #86EFAC;color:#14532D}
.opt.no{background:#FFE4E6;box-shadow:0 3px 0 #FDA4AF;color:#881337;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.big{display:block;margin:18px auto 0;background:var(--blue);color:#fff;padding:14px 26px;border-radius:16px;font-size:17px;font-weight:900;box-shadow:0 4px 0 #1E3A8A}
.big.red{background:var(--red);box-shadow:0 4px 0 #9F1239}.big.green{background:var(--green);box-shadow:0 4px 0 #14532D}
.speak{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;font-size:44px;display:grid;place-items:center;margin:10px auto 6px;box-shadow:0 6px 0 #3730A3}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:3/4;perspective:600px;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.flip .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;font-weight:900;padding:6px;text-align:center}
.card .f{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-size:28px;font-family:'Noto Sans KR'}
.card .b{background:#fff;border:3px solid #DDE3EE;transform:rotateY(180deg);font-size:17px;color:var(--navy)}
.card .b.kr{font-size:22px}
.card.done .b{border-color:var(--green);background:#F0FDF4}
.uz{text-align:center;font-size:18px;font-weight:800;color:var(--mut);margin:6px 0 14px}
.slot{min-height:70px;border:3px dashed #CBD5E1;border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.slot.ok{border-color:var(--green);background:#F0FDF4}.slot.no{border-color:var(--red);background:#FFF1F2;animation:shake .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:#fff;border:2px solid #DDE3EE;border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700;font-family:'Noto Sans KR';box-shadow:0 3px 0 #DDE3EE}
.slot .chip{background:#EEF2FF;border-color:#C7D2FE}
.res{text-align:center;padding:20px 6px}
.res .stars{font-size:46px;letter-spacing:6px}
.res h2{margin:8px 0;font-size:28px;color:var(--navy)}
.res p{color:var(--mut);font-weight:700}
.teams{display:flex;gap:10px;justify-content:center;margin-bottom:10px}
.team{border-radius:14px;padding:8px 16px;font-weight:900;background:#F4F6FB;border:3px solid transparent}
.team.a.on{border-color:var(--red);background:#FFF1F2}.team.b.on{border-color:var(--blue);background:#EFF6FF}
.toggle{display:flex;align-items:center;gap:8px;font-weight:800;color:#fff;margin-top:12px}
.toggle input{width:20px;height:20px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.combo{color:var(--amber);font-weight:900}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:8}
.tq{font-size:21px;font-weight:700;line-height:1.6;background:#F8FAFF;border-left:5px solid var(--amber);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.opts.one{grid-template-columns:1fr}.opts.one .opt{text-align:left;font-size:18px}.nb{color:var(--blue);margin-right:6px}
.expl{margin-top:14px;background:#FFFBEB;border:2px solid #FDE68A;border-radius:14px;padding:12px 16px;font-weight:700;line-height:1.6}
.tfcard{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;background:#F4F6FB;border-radius:20px;padding:30px 16px;margin:6px 0 16px;transition:background .15s}
.tfcard.good{background:#DCFCE7}.tfcard.bad{background:#FFE4E6}
.tfcard .k{font-size:44px;font-weight:900;color:var(--navy)}.tfcard .eq{font-size:36px;color:var(--mut);font-weight:900}.tfcard .u{font-size:28px;font-weight:900;color:var(--violet)}
.tfb{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ok2{background:#DCFCE7!important;color:#14532D!important;font-size:22px!important}.no2{background:#FFE4E6!important;color:#881337!important;font-size:22px!important}
.wheelbox{position:relative;width:min(360px,86vw);margin:0 auto}.wheelbox canvas{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 0 #E2E8F0)}
.pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:34px;color:var(--navy);z-index:2}
.dare{margin-top:16px;background:#FFF7ED;border:3px solid #FDBA74;border-radius:20px;padding:18px;text-align:center}
.dare .dn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:900;font-size:22px}
.dare .dtx{font-size:22px;font-weight:900;color:var(--navy);margin:10px 0 4px;line-height:1.4}
.mis{margin-top:16px}.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:10px}
.mi{background:#F4F6FB;border-radius:12px;padding:10px 12px;font-weight:800}.mi.done{background:#DCFCE7;color:#14532D}
.hide{display:none!important}
.foot{text-align:center;color:var(--mut);font-weight:700;font-size:13px;margin-top:22px}
@media(max-width:560px){.word .k{font-size:44px}.opt{font-size:16px;padding:16px 8px}.hero h1{font-size:24px}.grid{grid-template-columns:repeat(3,1fr)}}
.gt{font-size:18px;color:var(--navy)}
.mut{color:var(--mut);font-weight:700}
.big.ghost{background:#EEF2FA;color:var(--navy);box-shadow:0 4px 0 #CBD5E1}.big.violet{background:var(--violet);box-shadow:0 4px 0 #4C1D95}
.row.c{justify-content:center}.ph{color:var(--mut);font-weight:700}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}
.lv{background:#fff;border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 4px 0 #E2E8F0;border:3px solid transparent;display:flex;flex-direction:column;gap:3px;align-items:center}
.lv .li{font-size:30px}.lv b{color:var(--navy);font-size:16px}.lv small{color:var(--mut);font-weight:700;font-size:12px;line-height:1.3}.lv i{font-style:normal;font-size:12px;font-weight:900;color:var(--lc)}
.lv.on{border-color:var(--lc);background:linear-gradient(180deg,#fff,#F8FAFF);transform:translateY(-2px)}
.sec{margin:22px 0 0;font-size:22px;color:var(--lc)}
.word.emo .k{font-size:84px}.word.lat .k{font-size:48px;font-family:'Nunito'}.word.tq .k{font-size:26px;line-height:1.5;font-weight:800}
.olist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.oi{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:2px solid #DDE3EE;border-radius:14px;padding:12px 14px;font-size:17px;box-shadow:0 3px 0 #DDE3EE}
.oi b{color:var(--blue);min-width:34px}.oi.done{background:#EEF2FF;border-color:#C7D2FE;box-shadow:none}.oi.done b{background:var(--blue);color:#fff;border-radius:50%;width:28px;height:28px;min-width:28px;display:grid;place-items:center}
.tgt{text-align:center;font-size:20px;font-weight:800;margin-bottom:10px}.tgt b{font-size:40px;color:var(--red);margin:0 6px}
.rain{position:relative;height:440px;background:linear-gradient(180deg,#E0F2FE,#F0F9FF);border-radius:18px;overflow:hidden}
.drop{position:absolute;top:-60px;width:58px;height:58px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #BAE6FD;font-size:28px;font-weight:900;color:var(--navy);animation:fall linear forwards}
.drop.hit{background:#DCFCE7;transform:scale(1.3)}.drop.miss{background:#FFE4E6}
@keyframes fall{to{top:460px}}
@media(max-width:700px){.lvls{grid-template-columns:repeat(3,1fr)}.lv small{display:none}.rain{height:380px}@keyframes fall{to{top:400px}}}
.kz{position:relative;display:inline-block;flex-shrink:0;line-height:0;transform-origin:50% 100%;animation:kzBreath 3.2s ease-in-out infinite}
.kz.tilt{animation:kzTilt 1.6s ease-in-out}
.kz.jump{animation:kzJump .7s cubic-bezier(.3,1.6,.5,1)}
.kz.jump3{animation:kzJump .7s cubic-bezier(.3,1.6,.5,1) 3}
.kz.sad{animation:kzSad 1.4s ease-in-out}
.kz.look{animation:kzLook 2.2s ease-in-out}
@keyframes kzBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.03)}}
@keyframes kzTilt{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-8deg)}}
@keyframes kzJump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-22%) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:none}}
@keyframes kzSad{0%,100%{transform:rotate(0) translateY(0)}20%{transform:rotate(6deg) translateY(3%)}40%{transform:rotate(-6deg) translateY(3%)}60%{transform:rotate(4deg) translateY(3%)}}
@keyframes kzLook{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(-4%) rotate(-4deg)}65%{transform:translateX(4%) rotate(4deg)}}
.kz svg{width:100%;height:auto;display:block;overflow:visible}
.kz .eye,.kz .hap{transform-box:fill-box;transform-origin:center;transition:transform .08s ease-in,opacity .1s}
.kz.blink .eye{transform:scaleY(.08)}
.kz .hap{opacity:0}
.kz.happy .eye{opacity:0}
.kz.happy .hap{opacity:1}
.kz .tear{opacity:0;transition:opacity .25s}
.kz.sad .tear{opacity:1}
.kz .tail{transform-box:fill-box;transform-origin:0% 100%;animation:kzWag 1.8s ease-in-out infinite}
.kz .ear{transform-box:fill-box;transform-origin:50% 100%}
.kz .ear.l{animation:kzEar 6s ease-in-out infinite}
.kz .ear.r{animation:kzEar 6s ease-in-out 3s infinite}
.kz .headg{transform-box:fill-box;transform-origin:50% 90%}
.kz.look .headg{animation:kzHead 2.2s ease-in-out}
@keyframes kzWag{0%,100%{transform:rotate(0)}50%{transform:rotate(-16deg)}}
@keyframes kzEar{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-10deg)}96%{transform:rotate(6deg)}}
@keyframes kzHead{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(7deg)}}
.expl::before,.toast::before,.gfoot .fcat{background-color:#E6EBFF!important}

.kz.swap{transition:transform .22s ease-in,opacity .22s;transform:scale(.6) rotate(-10deg)!important;opacity:0}
.kz.swapin{animation:kzIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes kzIn{0%{transform:scale(.6) rotate(10deg);opacity:0}100%{transform:none;opacity:1}}

<body>
<canvas id="cf"></canvas>
<div class="toast" id="toast"></div>
<div id="app">
 <header>
  <div class="brand"><div class="logo">강</div><div><b>Gangnam Study</b><small>Koreyscha o'yinlar</small></div></div>
  <div class="pill">⭐ <span id="total">0</span> ball</div>
 </header>
 <main id="view"></main>
 <div class="foot">🐾 Ko'zmunchoq bilan o'rganing · har o'yinda yangi so'zlar — barcha so'zlar tugamaguncha takrorlanmaydi<br>Gangnam Study · Jizzax · 한국어 공부는 재미있어요!</div>
</div>
<script>

const MEM={};
function deck(name,arr,n){
 let st=store.get('dk_'+name,null)||MEM[name];
 if(!st||st.len!==arr.length)st={len:arr.length,q:[],last:[]};
 if(st.q.length<n){const fresh=shuffle([...arr.keys()]).filter(i=>!st.q.includes(i));const recent=st.last||[];
  st.q=st.q.concat(fresh.filter(i=>!recent.includes(i)),fresh.filter(i=>recent.includes(i)))}
 const take=st.q.slice(0,n);st.q=st.q.slice(n);st.last=take;MEM[name]=st;store.set('dk_'+name,st);
 return take.map(i=>arr[i]);
}

function mcq(key,title,items,o={}){
 const me=++SES;let i=0,score=0,combo=0,team=0,ts=[0,0];const N=items.length,TL=o.timer||0;
 function render(){
  if(!live(me))return;
  if(i>=N){if(o.test&&score>=N*8)mission('tp');const extra=S.team&&TL?`<p class="teamres">🔴 1-jamoa: <b>${ts[0]}</b> &nbsp; 🔵 2-jamoa: <b>${ts[1]}</b><br>${ts[0]===ts[1]?'Durang!':(ts[0]>ts[1]?'1-jamoa':'2-jamoa')+' g\'olib! 🏆'}</p>`:'';return result(key,score,N*(TL?15:10),extra)}
  const it=items[i];const opts=shuffle(it.opts);
  view.innerHTML=`<div class="panel game">${topBar(title,`<span class="stat">${i+1}/${N}</span><span class="stat">⭐ ${score}</span>${combo>1?`<span class="stat combo">🔥 x${combo}</span>`:''}`)}
   ${S.team&&TL?`<div class="teams"><div class="team a ${team===0?'on':''}">🔴 1-jamoa: ${ts[0]}</div><div class="team b ${team===1?'on':''}">🔵 2-jamoa: ${ts[1]}</div></div>`:''}
   ${TL?'<div class="bar"><i id="tb" style="width:100%"></i></div>':''}
   ${it.say?`<button class="speak" id="sp">🔊</button>`:''}
   <div class="word ${it.cls||''}"><div class="k ${it.say&&!it.show?'hide':''}" id="kw">${it.q}</div><div class="h">${it.sub||''}</div></div>
   <div class="opts ${o.one?'one':''}">${opts.map((x,k)=>`<button class="opt kr"><span class="ob">${'ABCD'[k]}</span>${x}</button>`).join('')}</div>
   <div class="expl hide" id="ex"></div>${o.explain?'<button class="big hide" id="nx">Keyingi →</button>':''}</div>${buddy()}`;
  bindBack();
  if(it.say){$('#sp').onclick=()=>{if(!say(it.say))$('#kw').classList.remove('hide')};setTimeout(()=>{if(live(me)&&!say(it.say))$('#kw').classList.remove('hide')},250)}
  let lt=TL*10;clearInterval(T);

  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  const txt=b=>b.textContent.slice(1);
  function answer(b){clearInterval(T);view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(txt(x)===it.a)x.classList.add('ok')});
   if(it.say)$('#kw').classList.remove('hide');
   const right=b&&txt(b)===it.a;kzReact(right);
   if(right){combo++;const pts=TL?Math.min(15,10+Math.ceil(lt/(TL*2))+(combo>2?2:0)):10;score+=pts;if(S.team&&TL)ts[team]+=pts;snd('ok')}
   else{combo=0;if(b)b.classList.add('no');snd('no');if(!b)toast('Vaqt tugadi ⏰')}
   if(o.explain){const ex=$('#ex');ex.innerHTML=(right?'✅ <b>To\'g\'ri!</b> ':'❌ <b>To\'g\'ri javob: '+it.a+'</b><br>')+(it.exp?'📌 '+it.exp:'');ex.classList.remove('hide');const nx=$('#nx');nx.classList.remove('hide');nx.onclick=()=>{i++;team=1-team;render()}}
   else setTimeout(()=>{if(live(me)){i++;team=1-team;render()}},1100)}
 }
 render();
}

function fromPairs(name,pairs,n,o={}){return deck(name,pairs,n).map(p=>{const a=p[1];const pool=pairs.filter(x=>x[1]!==a);const wrong=[];while(wrong.length<3&&pool.length){const w=pool.splice(Math.floor(Math.random()*pool.length),1)[0][1];if(!wrong.includes(w))wrong.push(w)}return {q:p[0],a,opts:[a,...wrong],sub:o.sub||'',say:o.say?p[0]:null,show:o.show,cls:o.cls||''}})}
function fromTest(name,T,n){return deck(name,T,n).map(([q,op,e])=>({q:q.replace(/\[(.+?)\]/,'<u>$1</u>'),a:op[0],opts:op,exp:e,cls:'tq'}))}

function build(key,title,name,bank,n=6){
 const me=++SES;const list=deck(name,bank,Math.min(n,bank.length));let i=0,score=0;
 function render(){
  if(!live(me))return;if(i>=list.length)return result(key,score,list.length*10);
  const [kr,uz]=list[i];const words=kr.split(' ');let chosen=[];let pool=shuffle(words.map((w,k)=>({w,k})));if(pool.map(x=>x.w).join(' ')===kr&&words.length>1)pool=pool.reverse();let tries=0;
  function draw(){
   view.innerHTML=`<div class="panel game">${topBar(title,`<span class="stat">${i+1}/${list.length}</span><span class="stat">⭐ ${score}</span>`)}
    <p class="uz">🇺🇿 ${uz}</p><div class="slot" id="slot">${chosen.length?chosen.map((c,j)=>`<button class="chip" data-s="${j}">${c.w}</button>`).join(''):'<span class="ph">So\'zlarni bosib shu yerga joylang</span>'}</div>

    <div class="row c"><button class="big violet" id="hear">🔊 Eshitish</button><button class="big green" id="chk">Tekshirish</button></div></div>${buddy()}`;
   bindBack();
   view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{chosen.push(pool.splice(+b.dataset.p,1)[0]);snd('flip');draw()});
   view.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pool.push(chosen.splice(+b.dataset.s,1)[0]);draw()});
   $('#hear').onclick=()=>{if(!say(kr))toast(kr)};
   $('#chk').onclick=()=>{if(pool.length){toast('Hamma so\'zlarni joylang');return}
    const ok=chosen.map(c=>c.w).join(' ')===kr;const sl=$('#slot');kzReact(ok);
    if(ok){sl.classList.add('ok');const p=tries===0?10:tries===1?6:3;score+=p;snd('ok');say(kr);setTimeout(()=>{if(live(me)){i++;render()}},1400)}
    else{tries++;sl.classList.add('no');snd('no');if(tries>=3)toast('To\'g\'ri javob: '+kr);setTimeout(()=>{if(!live(me))return;if(tries>=3){i++;render()}else{pool=pool.concat(chosen);chosen=[];draw()}},tries>=3?2200:800)}};
  }
  draw();
 }
 render();
}
function order(key,title,name,bank,n=3){
 const me=++SES;const list=deck(name,bank,Math.min(n,bank.length));let i=0,score=0;
 function render(){
  if(!live(me))return;if(i>=list.length)return result(key,score,list.length*10);
  const right=list[i];const labels=['(가)','(나)','(다)','(라)'];let pool=shuffle(right.map((t,k)=>({t,k})));if(pool.every((x,k)=>x.k===k))pool=pool.reverse();let chosen=[],tries=0;
  const lab=pool.map((x,j)=>({...x,l:labels[j]}));pool=lab.slice();
  function draw(){
   view.innerHTML=`<div class="panel game">${topBar(title,`<span class="stat">${i+1}/${list.length}</span><span class="stat">⭐ ${score}</span>`)}
    <p class="uz">Gaplarni to'g'ri tartibda bosing (1-gapdan boshlab)</p>
    <div class="olist">${chosen.map((c,j)=>`<div class="oi done"><b>${j+1}</b><span class="kr">${c.l} ${c.t}</span></div>`).join('')}</div>
    <div class="olist">${pool.map((c,j)=>`<button class="oi" data-p="${j}"><b>${c.l}</b><span class="kr">${c.t}</span></button>`).join('')}</div>
    <div class="row c"><button class="big ghost" id="rs">↺ Qaytadan</button></div></div>${buddy()}`;
   bindBack();
   $('#rs').onclick=()=>{pool=lab.slice();chosen=[];draw()};
   view.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{chosen.push(pool.splice(+b.dataset.p,1)[0]);snd('flip');
    if(!pool.length){const ok=chosen.every((c,k)=>c.k===k);kzReact(ok);
     if(ok){const p=tries===0?10:tries===1?6:3;score+=p;snd('win');setTimeout(()=>{if(live(me)){i++;render()}},1300)}
     else{tries++;snd('no');if(tries>=2)toast('To\'g\'ri tartib: '+right.map((t,k)=>lab.find(x=>x.k===k).l).join(' → '));setTimeout(()=>{if(!live(me))return;if(tries>=2){i++;render()}else{pool=lab.slice();chosen=[];draw()}},tries>=2?2600:900)}}
    else draw()});
  }
  draw();
 }
 render();
}

const LV=()=>LEVELS.find(l=>l.id===S.lvl)||LEVELS[0];
function home(){

 view.innerHTML=`<section class="hero"><div class="hl"><div class="tag">🐾 Ko'zmunchoq bilan o'ynab o'rganamiz</div><h1>Koreyscha o'yinlar</h1><p>${nG} ta o'yin · 5 ta daraja · har safar yangi so'zlar</p>
   <input class="inp" id="nm" placeholder="Ismingizni yozing" value="${(S.name||'').replace(/"/g,'')}">
   <label class="toggle"><input type="checkbox" id="team" ${S.team?'checked':''}> Jamoaviy rejim (2 jamoa navbatma-navbat)</label></div>
  <div class="hr">${kzHTML(L.kz,'hero-kz','kzHome')}<div class="hbub" id="hb"><b>${greet}${S.name?', '+S.name:''}! 🐾</b>${rnd(TIPS)}</div></div></section>
  <div class="lvls">${LEVELS.map(l=>`<button class="lv ${l.id===L.id?'on':''}" data-l="${l.id}" style="--c:${l.col};--b:${l.bgc}"><span class="li">${l.ic}</span><b>${l.name}</b><small>${l.sub}</small></button>`).join('')}</div>
  <div class="sech"><h2>${L.ic} ${L.name}</h2><span>${L.games.length} ta o'yin</span></div>
  <div class="modes">${L.games.map(g=>{const k=L.id+':'+g.id;const tot=g.bank.length;return `<button class="mode" data-g="${g.id}"><div class="ic" style="background:${g.bg}">${g.ic}</div><b>${g.t}</b><span>${g.d}</span><div class="meta"><em>📚 ${tot} ta</em>${S.best[k]?`<em class="gold">🏆 ${S.best[k]}</em>`:(S.played[k]?'<em>✅</em>':'')}</div></button>`}).join('')}</div>
  <div class="panel mis"><div class="mh"><b>🏅 Missiyalar</b><span class="mut">har biri +20 ball</span></div><div class="mlist">${MISSIONS.map(m=>`<div class="mi ${S.mis[m.id]?'done':''}">${S.mis[m.id]?'✅':m.ic} ${m.t}</div>`).join('')}</div></div>`;
 view.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{S.lvl=b.dataset.l;store.set('lvl',S.lvl);home()});
 $('#nm').oninput=e=>{S.name=e.target.value;store.set('name',S.name)};
 $('#team').onchange=e=>{S.team=e.target.checked};
 const k=$('#kzHome');k.onclick=()=>{snd('meow');k.classList.add('happy');kzAnim(k,'jump',800);setTimeout(()=>k.classList.remove('happy'),900);$('#hb').innerHTML=`<b>Ko'zmunchoq 🐾</b>${rnd(TIPS)}`};
 view.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{const g=L.games.find(x=>x.id===b.dataset.g);const key=L.id+':'+g.id;CUR=()=>{window.scrollTo(0,0);g.run(key)};CUR()});
}
