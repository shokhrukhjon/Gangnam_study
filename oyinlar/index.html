function wheel(key,title,dares){
 const me=++SES;const items=shuffle(dares).slice(0,8);let rot=0,spinning=false,done=store.get('dares',0);
 const C=['#E11D48','#2563EB','#F59E0B','#16A34A','#7C3AED','#0EA5E9','#EC4899','#14B8A6'];
 view.innerHTML=`<div class="panel">${topBar(title,`<span class="stat" id="dd">✅ ${done} ta shart</span>`)}<p class="uz">G'ildirakni aylantiring va chiqqan shartni bajaring! O'qituvchi yoki sinf baholaydi.</p>
  <div class="wheelbox"><div class="pin">▼</div><canvas id="wh" width="360" height="360"></canvas></div><button class="big red" id="spin">🎡 Aylantirish</button>
  <div class="dare hide" id="dare"><div id="dt"></div><div class="row c"><button class="big green" id="ok">✅ Bajardim (+15)</button><button class="big ghost" id="skip">⏭ O'tkazish</button></div></div></div>`;
 bindBack();const g=$('#wh').getContext('2d'),n=items.length;
 function draw(){g.clearRect(0,0,360,360);for(let k=0;k<n;k++){const a0=rot+k*2*Math.PI/n,a1=a0+2*Math.PI/n;g.beginPath();g.moveTo(180,180);g.arc(180,180,170,a0,a1);g.closePath();g.fillStyle=C[k%8];g.fill();g.save();g.translate(180,180);g.rotate(a0+Math.PI/n);g.fillStyle='#fff';g.font='900 26px Nunito';g.textAlign='right';g.fillText(k+1,150,9);g.restore()}
  g.beginPath();g.arc(180,180,34,0,2*Math.PI);g.fillStyle='#fff';g.fill();g.fillStyle='#0F1E4F';g.font='900 22px Noto Sans KR';g.textAlign='center';g.fillText('시작',180,188)}
 draw();
 $('#spin').onclick=()=>{if(spinning)return;spinning=true;$('#dare').classList.add('hide');const target=rot+Math.PI*2*(5+Math.random()*3);const start=rot,t0=performance.now(),dur=3200;snd('flip');
  (function an(t){if(!live(me))return;const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);rot=start+(target-start)*e;draw();if(p<1)requestAnimationFrame(an);else{spinning=false;
   const ang=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);const k=Math.floor(ang/(2*Math.PI/n));snd('win');
   $('#dt').innerHTML=`<div class="dn" style="background:${C[k%8]}">${k+1}</div><div class="dtx">${items[k]}</div>`;$('#dare').classList.remove('hide')}})(t0)};
 $('#ok').onclick=()=>{done++;store.set('dares',done);$('#dd').textContent='✅ '+done+' ta shart';addTotal(15);markPlayed(key);confetti();toast('Zo\'r! +15 ball');$('#dare').classList.add('hide');if(done>=3)mission('d3')};
 $('#skip').onclick=()=>$('#dare').classList.add('hide');
}
